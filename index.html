<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Consulta las ventajas de los tipos Pokémon con una interfaz inspirada en el clan The Akatsuki.">
  <meta name="theme-color" content="#0b0b0b">
  <title>The Akatsuki | Calculador de ventajas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="stage">
    <div class="glow glow-a" id="glowA" aria-hidden="true"></div>
    <div class="glow glow-b" id="glowB" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <main class="content">
      <div class="logo-container">
        <img src="./img/LogoClan.png" alt="Emblema de The Akatsuki" class="site-logo" width="220">
      </div>

      <header class="header">
        <div class="header-top">
          <span class="dex-lamp" aria-hidden="true"></span>
          <h1 class="title">CALCULADOR DE VENTAJAS</h1>
        </div>
        <p class="subtitle">Elige uno o varios tipos y descubre sus ventajas en combate.</p>
      </header>

      <section class="grid" id="grid" role="listbox" aria-label="Tipos de Pokémon" aria-multiselectable="true"></section>

      <section class="result-panel" aria-label="Resultados de combate">
        <div class="result-head" id="resultHead"></div>
        <div class="result-caption" id="resultCaption" hidden>Ventaja estratégica contra</div>
        <div class="result-body" id="resultBody" aria-live="polite"></div>
      </section>
    </main>
    <div class="bottom-space"></div>
  </div>
  <script src="./js/app.js" defer></script>
</body>
</html>
