
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Consulta las ventajas de los tipos Pokémon con una interfaz inspirada en Akatsuki.">
<meta name="theme-color" content="#0b0b0b">
<title>The Akatsukis |</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="stage">
  <div class="glow glow-a" id="glowA"></div>
  <div class="glow glow-b" id="glowB"></div>
  <div class="scanlines"></div>

      <div class="logo-container" style="margin-bottom: 15px;">
        <img src="./img/LogoClan.png" alt="The Akatsuki Logo" style="max-width: 220px; height: auto; display: block; margin: 0 auto;">
      </div>

  <div class="content">
    <header class="header">
      <div class="header-top">
        <span class="dex-lamp"></span>
        <h1 class="title">THE AKATSUKI <span class="title-mark">//</span>CALCULADOR DE VENTAJAS</h1>
      </div>
<p class="subtitle" style="white-space: nowrap;">Elige uno o varios tipos y descubre sus ventajas en combate.</p>    </header>

    <section class="grid" id="grid" role="listbox" aria-label="Tipos de Pokémon" aria-multiselectable="true"></section>

    <section class="result-panel">
      <div class="result-head" id="resultHead"></div>
      <div class="result-caption" id="resultCaption" hidden>Ventaja estratégica contra</div>
      <div class="result-body" id="resultBody" aria-live="polite"></div>
    </section>
  </div>
  <div class="bottom-space"></div>
</div>

<script src="./js/app.js" defer></script>
</body>
</html>
